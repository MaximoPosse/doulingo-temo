<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1650 330" width="1650" height="330" font-family="Arial, Helvetica, sans-serif">
<rect width="1650" height="330" fill="#ffffff"/>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="13" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#1f4e79"/></marker></defs>
<rect x="20" y="60" width="280" height="120" fill="#cfe2f7" stroke="#2b3a55" stroke-width="2"/>
<text x="160" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#000">1 · Pedido</text><text x="160" y="137" text-anchor="middle" font-size="14" fill="#222">registro o recuperación</text><text x="160" y="154" text-anchor="middle" font-size="14" fill="#222">desde la app (PKCE)</text><line x1="300" y1="120" x2="350" y2="120" stroke="#1f4e79" stroke-width="5" marker-end="url(#ah)"/><rect x="350" y="60" width="280" height="120" fill="#cfe2f7" stroke="#2b3a55" stroke-width="2"/>
<text x="490" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#000">2 · Correo</text><text x="490" y="137" text-anchor="middle" font-size="14" fill="#222">Supabase envía el enlace</text><text x="490" y="154" text-anchor="middle" font-size="14" fill="#222">con redirect doulingo://</text><line x1="630" y1="120" x2="680" y2="120" stroke="#1f4e79" stroke-width="5" marker-end="url(#ah)"/><rect x="680" y="60" width="280" height="120" fill="#cfe2f7" stroke="#2b3a55" stroke-width="2"/>
<text x="820" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#000">3 · Android</text><text x="820" y="137" text-anchor="middle" font-size="14" fill="#222">intent-filter abre</text><text x="820" y="154" text-anchor="middle" font-size="14" fill="#222">la app CodeLingua</text><line x1="960" y1="120" x2="1010" y2="120" stroke="#1f4e79" stroke-width="5" marker-end="url(#ah)"/><rect x="1010" y="60" width="280" height="120" fill="#cfe2f7" stroke="#2b3a55" stroke-width="2"/>
<text x="1150" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#000">4 · appUrlOpen</text><text x="1150" y="137" text-anchor="middle" font-size="14" fill="#222">deepLink.js lee el code</text><text x="1150" y="154" text-anchor="middle" font-size="14" fill="#222">y descarta duplicados</text><line x1="1290" y1="120" x2="1340" y2="120" stroke="#1f4e79" stroke-width="5" marker-end="url(#ah)"/><rect x="1340" y="60" width="280" height="120" fill="#cde6d3" stroke="#2b3a55" stroke-width="2"/>
<text x="1480" y="116" text-anchor="middle" font-size="19" font-weight="bold" fill="#000">5 · Sesión</text><text x="1480" y="137" text-anchor="middle" font-size="14" fill="#222">exchangeCodeForSession</text><text x="1480" y="154" text-anchor="middle" font-size="14" fill="#222">registro o PASSWORD_RECOVERY</text><text x="20" y="40" font-size="22" font-weight="bold" fill="#1f4e79" text-anchor="start">Enlaces de confirmación y recuperación dentro del APK</text><rect x="20" y="230" width="1580" height="70" fill="#fdecc8" stroke="#2b3a55" stroke-width="2"/>
<text x="810" y="271" text-anchor="middle" font-size="19" font-weight="bold" fill="#000">Si el code es falso o venció: aviso en español “El enlace de acceso no sirve o ya venció”</text></svg>